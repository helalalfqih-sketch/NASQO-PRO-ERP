name: nasqo_pro_erp
description: نظام نسقو برو ERP المتكامل لإدارة المحاسبة، نقاط البيع، العملاء، المشتريات، الموارد البشرية، والتصنيع (Flutter RTL).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ">=0.19.0 <0.21.0"
  sqflite: ^2.3.3
  path: ^1.9.0
  crypto: ^3.0.6
  cryptography: ^2.7.0
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  google_sign_in: 6.3.0
  workmanager: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  # Generated by `npm run sync:flutter-hybrid` before Flutter builds.
  assets:
    - assets/web/
    - assets/web/assets/
