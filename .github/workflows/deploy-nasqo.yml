name: Build and test NASQO mobile release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nasqo-mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - name: Install and test
        run: |
          npm install --no-audit --no-fund
          npm run check:runtime
          npm run lint
          npx tsc -p tsconfig.server.json --noEmit
          node --check server/smartproPolicy.ts
          node --check server/smartpro.ts
          npx tsx --test tests/smartpro-policy.test.ts tests/smartpro-invoice.test.ts tests/smartpro-stock.test.ts tests/smartpro-returns.test.ts tests/smartpro-voucher.test.ts
          npx tsx --test tests/legacy-search-binding.test.ts tests/legacy-live-safety.test.ts tests/legacy-invoice-preview.test.ts
          npx tsx --test tests/workspace-isolation.test.ts tests/local-database.test.ts
          node --test tests/authError.test.mjs tests/googleDriveAuthError.test.mjs tests/public-backup-guard.test.mjs tests/sqlite-local-production.test.mjs
          npx tsx --test tests/unified-sqlite.test.ts
          npx tsx --test tests/erp-crud.test.ts tests/erp-input.test.ts tests/hybrid-message-limits.test.ts tests/tabular-import.test.ts tests/import-restore-safety.test.ts
          npx tsx --test tests/erp-posting-boundaries.test.ts tests/erp-financial-read.test.ts tests/accounting-audit-25.test.ts
          npx tsx --test tests/invoiceCatalog.test.ts tests/invoice-search.test.ts tests/business-setup.test.ts
          npm run build
          PLAYWRIGHT_CHROMIUM_EXECUTABLE="$(command -v google-chrome)" CRUD_UI_OUTPUT="$RUNNER_TEMP/crud-ui" npx tsx scripts/verify-crud-ui.ts
          # Rebuild only the client with an isolated URL prefix for ERP domain routing.
          # Source runtime integrity checks are unchanged.
          npx vite build --base /nsqo-app/
          node deploy/prepare-subpath.mjs
          npm run test:sites
      - name: Verify invoice warehouse selection in the offline UI
        run: |
          npm run build:hybrid
          NASQO_INVOICE_WAREHOUSE_ONLY=1 NASQO_ACCEPTANCE_OUT="$RUNNER_TEMP/invoice-warehouse" PLAYWRIGHT_CHROMIUM_EXECUTABLE="$(command -v google-chrome)" npx tsx scripts/verify-hybrid-invoice-catalog.ts
      - name: Verify Android Back navigation in Chromium
        run: |
          npx playwright install --with-deps chromium
          npx playwright test tests/android-back-navigation.spec.ts tests/legacy-ui-binding.spec.ts tests/erp-startup-loading.spec.ts tests/smartpro-admin-ui.spec.ts tests/unified-sqlite-e2e.spec.ts tests/erp-financial-ui.spec.ts tests/invoice-onboarding.spec.ts --reporter=line
          npx playwright test tests/legacy-real-data.spec.ts --reporter=line
          npx playwright test tests/public-deployment-mobile.spec.ts --reporter=line
      - name: Prepare release
        run: |
          mkdir -p release/dist
          cp package.json package-lock.json server.ts Dockerfile.deploy release/
          cp -a server release/server
          cp -a src release/src
          mkdir -p release/scripts
          cp scripts/backup-sqlite.mjs release/scripts/
          cp -a dist/client release/dist/client
          printf '%s\n' "$GITHUB_SHA" > release/RELEASE_SHA
          tar -czf "$RUNNER_TEMP/nsqo-release.tar.gz" -C release .
      - name: Verify deployable production Docker image
        run: |
          docker build --pull -f release/Dockerfile.deploy -t "nasqo-ci:$GITHUB_SHA" release
          docker volume create nasqo-ci-sqlite-data
          docker run --rm -d --name nasqo-ci-smoke \
            -v nasqo-ci-sqlite-data:/app/data \
            -e NASQO_SQLITE_PATH=/app/data/nasqo.sqlite \
            -e NASQO_SQLITE_ADMIN_PASSWORD=ci-only-test-password \
            -e NASQO_SQLITE_SESSION_SECRET=ci-smoke-session-secret-longer-than-32-chars \
            "nasqo-ci:$GITHUB_SHA"
          trap 'docker rm -f nasqo-ci-smoke >/dev/null 2>&1 || true; docker volume rm nasqo-ci-sqlite-data >/dev/null 2>&1 || true' EXIT
          healthy=0
          for i in $(seq 1 25); do
            if docker exec nasqo-ci-smoke node -e 'fetch("http://127.0.0.1:3000/api/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'; then
              healthy=1
              break
            fi
            sleep 1
          done
          docker exec nasqo-ci-smoke node -e 'fetch("http://127.0.0.1:3000/api/db/auth/status").then(async r=>{const s=await r.json();if(!s.authenticated)process.exit(1)}).catch(()=>process.exit(1))'
          if [[ "$healthy" != "1" ]]; then
            docker logs nasqo-ci-smoke --tail 40
            exit 1
          fi
      - name: Save tested release artifact
        uses: actions/upload-artifact@v4
        with:
          name: nsqo-release
          path: ${{ runner.temp }}/nsqo-release.tar.gz
          retention-days: 3
